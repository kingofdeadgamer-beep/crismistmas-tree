<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>❄️ Winter Magic — รุ่นสีสดคมชัดระดับ Ultra HD และเพลย์ลิสต์ YouTube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* =========================================================================
       WINTER MAGIC — ULTRA HD VIVID COLOR EDITION (MULTI-LANGUAGE)
       Deep Obsidian Canvas (#010308) + High-Contrast Frosted-Glass HUD
       ========================================================================= */
    :root {
      --bg-void: #010308;
      --glass-bg: rgba(5, 10, 22, 0.76);
      --glass-bg-strong: rgba(6, 13, 28, 0.88);
      --glass-border: rgba(130, 198, 255, 0.22);
      --glass-border-hover: rgba(180, 226, 255, 0.48);
      --text-primary: #f5faff;
      --text-secondary: rgba(214, 234, 255, 0.82);
      --text-muted: rgba(170, 200, 236, 0.65);
      --accent-ice: #00e5ff;
      --accent-gold: #ffd600;
      --accent-emerald: #00e676;
      --accent-magenta: #ff4081;
      --font-ui: 'Noto Sans Thai', 'Noto Sans SC', 'Noto Sans JP', 'Prompt', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-ui);
      user-select: none;
      -webkit-user-select: none;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-void);
    }

    /* Crisp dark-edge frame without adding milky haze */
    #stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 85px rgba(0, 1, 6, 0.76);
      z-index: 2;
    }

    #asciiCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: manipulation;
      image-rendering: crisp-edges;
    }

    /* -------------------------------------------------------------------------
       TOP-LEFT BADGE & TOP-CENTER STAGE PROGRESS PILL
       ------------------------------------------------------------------------- */
    .top-badge {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 13px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-primary);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
    }

    .top-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 10px var(--accent-emerald);
      animation: pulseDot 2.0s ease-in-out infinite;
    }

    .top-badge .pill {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(0, 229, 255, 0.14);
      border: 1px solid rgba(0, 229, 255, 0.34);
      color: var(--accent-ice);
    }

    .top-badge .pill.vivid {
      background: rgba(255, 64, 129, 0.16);
      border-color: rgba(255, 64, 129, 0.42);
      color: #ff80ab;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.65; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    .stage-toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      z-index: 12;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(6, 14, 32, 0.84);
      border: 1px solid rgba(255, 214, 0, 0.38);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 13px;
      font-weight: 500;
      color: #fffde7;
      white-space: nowrap;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .stage-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .stage-progress-track {
      width: 68px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      overflow: hidden;
    }

    .stage-progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-emerald), var(--accent-gold), var(--accent-magenta));
      transition: width 0.2s linear;
    }

    /* -------------------------------------------------------------------------
       START SCREEN OVERLAY CARD (FROSTED DARK GLASS
